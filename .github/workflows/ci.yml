name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]" build
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: python -m pytest -q
      - name: Example output is current
        run: |
          llms-txt-gen generate examples/docs --out /tmp/llms.txt --full --base-url https://acme.example.com/docs --strip-ext --optional 'changelog*'
          diff /tmp/llms.txt examples/llms.txt
          diff /tmp/llms-full.txt examples/llms-full.txt
          llms-txt-gen check examples/llms.txt --strict
      - name: Build and smoke-test the wheel
        run: |
          python -m build
          python -m pip install --force-reinstall dist/*.whl
          llms-txt-gen --version
          llms-txt-gen serve-snippet

  action:
    name: Run the action on the example
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: ./
        id: ltg
        with:
          source: examples/docs
          out: /tmp/action-llms.txt
          base-url: https://acme.example.com/docs
          strip-ext: "true"
          optional: "changelog*"
          full: "true"
      - name: Show outputs
        run: echo "links=${{ steps.ltg.outputs.links }} sections=${{ steps.ltg.outputs.sections }}"
